    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <script>
      (function () {
        try {
          var storedMode = localStorage.getItem('theme-preference');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

          var theme = 'light';
          if (storedMode === 'light' || storedMode === 'dark') {
            theme = storedMode;
          } else if (prefersDark) {
            theme = 'dark';
          }

          document.documentElement.setAttribute('data-bs-theme', theme);
        } catch (e) {
          // Fall back to default CSS if localStorage/matchMedia throws (e.g. blocked in private mode)
        }
      })();
    </script>
