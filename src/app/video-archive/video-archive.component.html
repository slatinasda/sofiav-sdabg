<div class="container p-md-4 py-lg-5">
  <div class="jumbotron">
    <h1 class="mb-4">Последни проповеди</h1>
    <p class="lead">
      Гледайте видеозаписи от последните ни проповеди и богослужения, споделени в YouTube канала на
      църквата.
    </p>
  </div>

  <div class="mb-5">
    <div class="container">
      <div *ngIf="!isLoading() && hasError()" class="video-empty-state text-center" role="alert">
        <div class="video-empty-state-icon" aria-hidden="true">
          <i class="fa fa-triangle-exclamation"></i>
        </div>
        <h3 class="fw-bold mb-2">Възникна грешка</h3>
        <p class="text-muted">Не успяхме да заредим видеата. Опитайте отново след малко.</p>
        <button type="button" class="btn btn-primary rounded-pill px-4" (click)="reload()">
          Опитайте отново
        </button>
      </div>

      <div
        *ngIf="!isLoading() && !hasError() && videos().length === 0"
        class="video-empty-state text-center"
      >
        <div class="video-empty-state-icon" aria-hidden="true">
          <i class="fa fa-video-slash"></i>
        </div>
        <h3 class="fw-bold mb-2">Няма налични видеа</h3>
        <p class="text-muted mb-0">Очаквайте нови записи от богослужения скоро.</p>
      </div>

      <div *ngIf="!hasError() && (isLoading() || videos().length > 0)" class="row g-4">
        <div
          *ngFor="let video of videos(); trackBy: trackByIndex"
          class="col-md-6 col-lg-4 d-flex align-items-stretch"
        >
          <app-video-card [video]="video"></app-video-card>
        </div>
      </div>

      <div
        *ngIf="!isLoading() && !hasError() && videos().length > 0"
        class="row d-flex justify-content-center mt-5"
      >
        <a
          class="col-auto btn btn-lg btn-primary btn-rounded py-3 px-4"
          href="https://youtube.com/@slatinasda/videos"
          target="_blank"
          rel="noopener noreferrer"
        >
          Вижте всички записи<i class="fa fa-arrow-right ms-2"></i>
        </a>
      </div>
    </div>
  </div>
</div>
