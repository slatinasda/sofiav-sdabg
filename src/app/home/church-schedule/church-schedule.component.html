<div id="church-schedule" class="bg-dark">
  <div class="container-fluid">
    <div class="row">
      <div class="col"></div>
      <div class="col-lg-4 py-5">
        <hr class="hr-lg mt-0 mb-2 w-10 ms-0 hr-primary" />
        <h2 class="display-4 text-slab text-white text-uppercase mt-0 section-content-gap">
          Посетете нашите <span class="text-primary fw-bold">богослужения</span>
        </h2>

        <div class="row mb-3">
          <div class="col-10 col-md-11 text-grey">
            <h4 class="fw-bold text-white text-uppercase">
              {{ agenda.isDaylightSaving ? 'Лятно' : 'Зимно' }} часово време
            </h4>
          </div>
        </div>

        <div
          *ngFor="let churchService of agenda.churchServiceAgenda; trackBy: trackByIndex"
          class="row mb-3"
        >
          <div class="col-2 col-md-1 text-center">
            <i class="{{ churchService.icon }} text-primary icon-2x" aria-hidden="true"></i>
          </div>
          <div class="col-10 col-md-11 text-grey">
            <h4 class="fw-bold text-white text-uppercase">{{ churchService.day }}</h4>
            <p>
              <span [innerHTML]="churchService.label"></span>
              <!-- Cannot nest <div> in <p> https://github.com/angular/angular/issues/6648 -->
              <span class="schedule-time">
                От <time>{{ churchService.time.startHour }}</time> до
                <time>{{ churchService.time.endHour }}</time> часа
              </span>
            </p>
          </div>
        </div>

        <div class="section-action">
          <a href="#contact" class="btn btn-primary btn-rounded px-4">
            Свържете се с нас
            <i class="fas fa-arrow-right ms-2" aria-hidden="true"></i>
          </a>
        </div>
      </div>
      <div class="col"></div>
    </div>
  </div>
</div>
