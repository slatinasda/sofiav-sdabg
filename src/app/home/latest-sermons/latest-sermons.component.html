<div
  *ngIf="isLoading() || latestVideos().length"
  id="latest-sermons"
  class="bg-op-1 bg-grey-dark py-3 py-lg-6"
>
  <div class="container">
    <div>
      <hr class="hr-lg mt-0 mb-3 w-10 mx-auto hr-primary" />
      <h2 class="text-center text-uppercase fw-bold my-0">Предишни теми</h2>
      <h5 class="text-center fw-light mt-2 mb-0 text-muted">
        Гледайте последните ни проповеди и богослужения
      </h5>
      <hr class="section-content-gap w-50 mx-auto" />
    </div>

    <div class="row g-3 g-md-4 justify-content-center">
      <div
        *ngFor="let video of latestVideos(); trackBy: trackByIndex"
        class="col-md-4 d-flex align-items-stretch"
      >
        <app-video-card [video]="video"></app-video-card>
      </div>
    </div>

    <div
      *ngIf="!isLoading() && latestVideos().length"
      class="text-center mt-2 mt-lg-3 mb-2 mb-lg-3"
    >
      <a routerLink="/video-archive" class="btn btn-primary btn-rounded btn-lg py-lg-3 px-lg-5">
        Всички проповеди
      </a>
    </div>
  </div>
</div>
