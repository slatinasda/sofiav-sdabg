<!-- Live stream -->
<div id="live-stream">
  <div class="container">
    <div>
      <hr class="hr-lg mt-0 mb-3 w-10 mx-auto hr-primary" />
      <h2 class="text-center text-uppercase fw-bold my-0">На живо</h2>
      <h5 class="text-center fw-light mt-2 mb-0 text-muted">
        Следете нашите преки излъчвания всяка събота от
        <time class="fw-bold">{{ agenda.saturdayMorningStreamStartTime }}</time>
      </h5>
      <hr class="section-content-gap w-50 mx-auto" />
    </div>
    <div class="row text-center">
      <div class="col-lg-10 offset-lg-1 video-container">
        <iframe
          width="560"
          height="315"
          [src]="liveStreamEmbedUrl()"
          title="Предаване на живо"
          frameborder="0"
          allow="autoplay; encrypted-media; picture-in-picture"
          allowfullscreen
        ></iframe>
      </div>
    </div>
  </div>
</div>
