<!-- Latest blog posts -->
<div *ngIf="latestPosts.length" id="latest-posts" class="py-3 py-lg-6">
  <div class="container">
    <div>
      <hr class="hr-lg mt-0 mb-3 w-10 mx-auto hr-primary" />
      <h2 class="text-center text-uppercase fw-bold my-0">Блог</h2>
      <h5 class="text-center fw-light mt-2 mb-0 text-muted">
        Прочетете нашите последни статии на духовна тематика
      </h5>
      <hr class="section-content-gap w-50 mx-auto" />
    </div>
    <div class="row g-3 g-md-4 justify-content-center">
      <div class="col-md-4" *ngFor="let post of latestPosts; trackBy: trackBySlug">
        <app-blog-post-card [post]="post" [showReadMore]="false"></app-blog-post-card>
      </div>
    </div>
    <div class="text-center section-action">
      <a routerLink="/blog" class="btn btn-primary btn-rounded btn-lg py-lg-3 px-lg-5">
        Всички публикации
      </a>
    </div>
  </div>
</div>
