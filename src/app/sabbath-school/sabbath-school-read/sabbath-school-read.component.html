<div class="py-3 py-lg-4">
  <div class="container">
    <!-- Loading -->
    <div *ngIf="loading" class="text-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Зареждане...</span>
      </div>
    </div>

    <div *ngIf="!loading" class="row">
      <!-- Sidebar -->
      <div
        *ngIf="quarterlyDetail"
        class="col-12 col-md-3 order-last order-md-first mt-4 mt-md-0 ss-sidebar-col"
      >
        <div class="ss-sidebar-row">
          <div class="ss-sidebar-cover-wrap text-center text-md-end mb-3">
            <a [routerLink]="['/sabbath-school', quarter]">
              <img
                [src]="quarterlyDetail.quarterly.cover"
                class="img-fluid rounded shadow-sm ss-sidebar-cover"
              />
            </a>
          </div>

          <div *ngIf="lessonDetail" class="text-md-end ss-sidebar-info">
            <a
              [routerLink]="['/sabbath-school', quarter]"
              class="d-block mb-3 fw-bold text-dark hover-text-primary"
            >
              {{ quarterlyDetail.quarterly.title }}
            </a>

            <!-- Day Navigation -->
            <div>
              <a
                *ngFor="let day of lessonDetail.days; let i = index"
                [routerLink]="['/sabbath-school', quarter, 'lessons', lessonId, slugify(i + 1)]"
                class="d-block py-2 mb-1 ss-day-link"
                [class.active]="read && day && day.id === read.id"
              >
                <p class="small text-muted mb-0">
                  {{ moment(day.date, 'DD/MM/YYYY').format('dddd, MMMM DD') }}
                </p>
                <span class="small" [class.fw-bold]="read && day && day.id === read.id">
                  {{ day.title }}
                </span>
              </a>
            </div>
          </div>
        </div>
      </div>

      <!-- Main Reading Area -->
      <div class="col-12 col-md-9 mt-4 mt-md-0 order-first order-md-last ss-reader-col">
        <div
          *ngIf="lessonDetail"
          class="border rounded"
          appSwipeNavigate
          [swipePrevRoute]="prevDayRoute"
          [swipeNextRoute]="nextDayRoute"
        >
          <!-- Header with cover image -->
          <div
            *ngIf="read"
            class="ss-read-header rounded-top"
            [style.background-image]="'url(' + lessonDetail.lesson.cover + ')'"
          >
            <div class="ss-read-header-overlay">
              <div class="d-flex justify-content-end p-2">
                <div class="ss-toolbar">
                  <!-- Reader Options -->
                  <div class="dropdown ss-toolbar-item">
                    <button
                      class="ss-toolbar-btn dropdown-toggle"
                      type="button"
                      data-bs-toggle="dropdown"
                      data-bs-auto-close="outside"
                    >
                      Aa
                    </button>
                    <div
                      class="dropdown-menu dropdown-menu-end ss-settings-panel"
                      data-swipe-ignore
                    >
                      <div class="ss-settings-group">
                        <div class="ss-segmented">
                          <button
                            *ngFor="let theme of readerThemes"
                            type="button"
                            class="ss-segmented-btn"
                            [class.active]="readerTheme === theme.value"
                            (click)="setTheme(theme.value)"
                          >
                            {{ theme.label }}
                          </button>
                        </div>
                      </div>
                      <div class="ss-settings-group">
                        <div class="ss-size-pill">
                          <button
                            type="button"
                            class="ss-size-pill-btn"
                            [disabled]="readerSize === minReaderSize"
                            (click)="decreaseSize()"
                            aria-label="Намали шрифта"
                          >
                            -<span class="ss-size-pill-label ss-size-pill-label-sm">A</span>
                          </button>
                          <button
                            type="button"
                            class="ss-size-pill-btn"
                            [disabled]="readerSize === maxReaderSize"
                            (click)="increaseSize()"
                            aria-label="Увеличи шрифта"
                          >
                            +<span class="ss-size-pill-label ss-size-pill-label-lg">A</span>
                          </button>
                        </div>
                      </div>
                    </div>
                  </div>

                  <button
                    *ngIf="audio.length"
                    class="ss-toolbar-btn ss-toolbar-item"
                    (click)="audioOpen = !audioOpen"
                  >
                    <i class="fa fa-headphones"></i>
                  </button>
                </div>
              </div>
              <div class="ss-read-header-text">
                <p class="text-light text-uppercase small mb-1">
                  {{ moment(read.date, 'DD/MM/YYYY').format('dddd, MMMM DD') }}
                </p>
                <h3 class="text-white fw-bold mb-0">{{ read.title }}</h3>
              </div>
            </div>
          </div>

          <!-- Reader Content -->
          <div
            *ngIf="read"
            class="ss-reader"
            [class.ss-theme-light]="readerTheme === 'light'"
            [class.ss-theme-sepia]="readerTheme === 'sepia'"
            [class.ss-theme-dark]="readerTheme === 'dark'"
            [class.ss-size-xs]="readerSize === 1"
            [class.ss-size-sm]="readerSize === 2"
            [class.ss-size-md]="readerSize === 3"
            [class.ss-size-lg]="readerSize === 4"
            [class.ss-size-xl]="readerSize === 5"
          >
            <div
              #readerContent
              class="p-3 p-md-4 p-lg-5"
              [innerHTML]="read.content"
              (click)="onReaderClick($event)"
            ></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Audio Player -->
<app-audio-player
  *ngIf="audioOpen && audio.length"
  [src]="audio[0].src"
  [title]="audio[0].title"
  [downloadHref]="audio[0].src"
  [downloadOpenInNewTab]="false"
  (closed)="audioOpen = false"
></app-audio-player>

<!-- Bible Verses Modal -->
<app-modal [(open)]="bibleModalOpen" title="Библейски стихове" size="lg" urlFragment="bible">
  <div class="bible-modal-content" [innerHTML]="selectedBibleHtml"></div>
</app-modal>
