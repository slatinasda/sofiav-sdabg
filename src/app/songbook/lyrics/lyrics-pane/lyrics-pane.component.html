<div
  class="lyrics-pane"
  [class.reader-theme-light]="readerSettings.theme() === 'light'"
  [class.reader-theme-sepia]="readerSettings.theme() === 'sepia'"
  [class.reader-theme-dark]="readerSettings.theme() === 'dark'"
  [style.--reader-font-size]="readerSettings.typography().fontSize"
  [style.--reader-line-height]="readerSettings.typography().lineHeight"
>
  <div class="lyrics-header" *ngIf="title">
    <div class="lyrics-header-inner">
      <button
        type="button"
        class="lyrics-back"
        (click)="back.emit()"
        aria-label="Назад към списъка"
        title="Назад към списъка"
      >
        <i class="fa fa-chevron-left"></i>
      </button>
      <div class="lyrics-header-main">
        <span class="lyrics-header-label">Песен</span>
        <span class="lyrics-header-title">{{ title }}</span>
      </div>
      <div class="lyrics-header-actions">
        <button
          *ngIf="lyrics && lyrics.lines.length > 0"
          type="button"
          class="lyrics-copy"
          [class.copied]="copied"
          (click)="copyLyrics()"
          [attr.aria-label]="copied ? 'Копирано' : 'Копирай текста'"
          [title]="copied ? 'Копирано' : 'Копирай текста'"
        >
          <i class="fa" [class.fa-copy]="!copied" [class.fa-check]="copied"></i>
        </button>

        <app-reader-settings>
          <button
            readerSettingsTrigger
            type="button"
            class="lyrics-settings-trigger"
            aria-label="Настройки на четене"
          >
            Aa
          </button>
        </app-reader-settings>
      </div>
    </div>
  </div>

  <div class="lyrics-status" *ngIf="loading">
    <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
    <span>Зареждане на текста...</span>
  </div>

  <div class="lyrics-status" *ngIf="!loading && error">
    <div class="lyrics-status-card">
      <span class="lyrics-status-icon"><i class="fa fa-microphone-slash"></i></span>
      <p class="lyrics-status-title">{{ error }}</p>
    </div>
  </div>

  <div class="lyrics-status" *ngIf="!loading && !error && !lyrics">
    <div class="lyrics-status-card">
      <span class="lyrics-status-icon"><i class="fa fa-compact-disc"></i></span>
      <p class="lyrics-status-title">Изберете песен, за да видите текста.</p>
    </div>
  </div>

  <div
    #scrollContainer
    class="lyrics-scroll"
    [class.timed]="lyrics.timed"
    *ngIf="!loading && !error && lyrics && lyrics.lines.length > 0"
    (wheel)="onUserScroll()"
    (touchstart)="onUserScroll()"
  >
    <p
      *ngFor="let line of lyrics.lines; let i = index"
      class="lyrics-line"
      [class.active]="lyrics.timed && i === activeIndex"
      [attr.data-line-index]="i"
      (click)="onLineClick(line)"
    >
      {{ line.text }}
    </p>
  </div>
</div>
